# Manual E2E for the DYNAMIC building_comfort driver (issue #71).
#
# Unlike e2e-building-comfort.yml (which boots Drasi Server from a static,
# fully-populated YAML per variant), this workflow runs
# examples/building_comfort/dynamic/run_dynamic.sh: it boots a BARE Drasi
# Server and applies the scenario at runtime via the admin REST API from
# reusable component JSON under dynamic/components/server/.
#
# This is a feasibility / manual workflow — pick a variant and run it. For
# HTTP, "standard" vs "adaptive" is a single swapped source component
# (adaptiveEnabled false/true); queries, reactions and the test-service
# config are identical, so results (determinism SHAs) must match.

name: E2E - building_comfort (dynamic)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Dynamic variant to run."
        type: choice
        required: true
        default: http_standard
        options:
          - http_standard
          - http_adaptive
          - grpc_standard
      drasi_server_version:
        description: "drasi-server release tag (e.g. v0.1.5). Empty = latest."
        required: false
        default: ""
      timeout_minutes:
        description: "Max minutes to wait for the test to finish."
        required: false
        default: "30"

permissions:
  contents: read

jobs:
  dynamic:
    name: building_comfort dynamic / ${{ inputs.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DYNAMIC_DIR: e2e-test-framework/examples/building_comfort/dynamic
      VARIANT: ${{ inputs.variant }}
      DRASI_SERVER_VERSION: ${{ inputs.drasi_server_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: e2e-test-framework

      - name: Install runtime deps (jq, curl)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq curl

      # test-run-host enables drasi-core's `middleware-jq` feature, which
      # pulls in jq-sys; jq-sys links against the system libjq + libonig.
      - name: Install build deps for libjq
        run: |
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libjq-dev libonig-dev \
            libprotobuf-dev protobuf-compiler cmake clang libclang-dev

      - name: Set JQ_LIB_DIR
        run: echo "JQ_LIB_DIR=$(dirname $(find /usr/lib -name 'libjq.so' | head -1))" >> "$GITHUB_ENV"

      - name: Compute timeout (seconds)
        run: |
          mins="${{ inputs.timeout_minutes }}"
          [[ -z "$mins" ]] && mins=30
          echo "TIMEOUT_SECS=$(( mins * 60 ))" >> "$GITHUB_ENV"

      # Map the chosen variant onto the run_dynamic.sh env knobs. Queries are
      # constant across variants; only the source component (and, for gRPC,
      # the reactions + ingress port + test-service config) change.
      - name: Resolve variant -> driver env
        run: |
          echo "SERVER_QUERIES_FILE=queries.json" >> "$GITHUB_ENV"
          case "$VARIANT" in
            http_standard)
              echo "SERVER_SOURCE_FILE=source_http.json"          >> "$GITHUB_ENV"
              echo "SERVER_REACTIONS_FILE=reactions_http.json"    >> "$GITHUB_ENV"
              echo "DRASI_SOURCE_PORT=9000"                       >> "$GITHUB_ENV"
              echo "TEST_CFG_SRC=$GITHUB_WORKSPACE/$DYNAMIC_DIR/config.http.json" >> "$GITHUB_ENV"
              ;;
            http_adaptive)
              echo "SERVER_SOURCE_FILE=source_http_adaptive.json" >> "$GITHUB_ENV"
              echo "SERVER_REACTIONS_FILE=reactions_http.json"    >> "$GITHUB_ENV"
              echo "DRASI_SOURCE_PORT=9000"                       >> "$GITHUB_ENV"
              echo "TEST_CFG_SRC=$GITHUB_WORKSPACE/$DYNAMIC_DIR/config.http.json" >> "$GITHUB_ENV"
              ;;
            grpc_standard)
              echo "SERVER_SOURCE_FILE=source_grpc.json"          >> "$GITHUB_ENV"
              echo "SERVER_REACTIONS_FILE=reactions_grpc.json"    >> "$GITHUB_ENV"
              echo "DRASI_SOURCE_PORT=50051"                      >> "$GITHUB_ENV"
              # TEST_CFG_SRC left unset -> driver default (config.json)
              ;;
            *)
              echo "Unknown variant: $VARIANT" >&2; exit 1 ;;
          esac

      - name: Build test-service
        working-directory: e2e-test-framework
        run: cargo build --release --manifest-path test-service/Cargo.toml

      - name: Run dynamic driver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTS_DIR: ${{ runner.temp }}/artifacts
          WORK_DIR: ${{ runner.temp }}/ci_work
        run: bash "${DYNAMIC_DIR}/run_dynamic.sh"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: building_comfort-dynamic-${{ inputs.variant }}
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: warn
