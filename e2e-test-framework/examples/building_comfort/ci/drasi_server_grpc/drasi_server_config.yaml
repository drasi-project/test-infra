# Drasi Server config for the building_comfort / drasi_server_grpc E2E test.
#
# The E2E test framework needs an external Drasi Server running with:
#   - a gRPC source listening on port 50051 (id "facilities-db") to receive
#     change events dispatched by the test framework, and
#   - two gRPC reactions streaming results back to the test framework's
#     gRPC reaction handlers:
#       - building-comfort               -> grpc://localhost:50052
#       - building-comfort-floor-agg     -> grpc://localhost:50053
#
# Run from this folder using either:
#   a) the prebuilt drasi-server binary (see
#      https://drasi.io/drasi-server/how-to-guides/installation/download-binary/):
#        <path/to>/bin/drasi-server --config drasi_server_config.yaml
#   b) a checkout of the drasi-server repo:
#        cargo run --release --manifest-path <path/to/drasi-server>/Cargo.toml -- --config drasi_server_config.yaml

apiVersion: drasi.io/v1
id: building-comfort-grpc
host: "0.0.0.0"
port: 8080
logLevel: info
persistConfig: false

autoInstallPlugins: true
# Disable cosign signature verification so locally-built plugins
# (e.g. target/release/plugins/ when running via `cargo run` from a
# drasi-server checkout) are loaded without a signed lockfile.
verifyPlugins: false
plugins:
  - ref: source/grpc
  - ref: reaction/grpc
  - ref: reaction/log

sources:
  # gRPC source matching the dispatcher in config.json:
  #   { "kind": "Grpc", "host": "localhost", "port": 50051,
  #     "source_id": "facilities-db", ... }
  - kind: grpc
    id: facilities-db
    autoStart: true
    host: "0.0.0.0"
    port: 50051
    timeoutMs: 60000

queries:
  - id: building-comfort
    autoStart: true
    queryLanguage: Cypher
    sources:
      - sourceId: facilities-db
    query: |
      MATCH (r:Room)
      RETURN elementId(r) AS RoomId,
             r.temperature AS Temperature,
             r.humidity AS Humidity,
             r.co2 AS Co2

  # Floor-level aggregate: exercises a one-hop traversal across
  # Floor -[:FLOOR_ROOM]-> Room plus avg / min / max / count aggregations.
  - id: building-comfort-floor-agg
    autoStart: true
    queryLanguage: Cypher
    sources:
      - sourceId: facilities-db
    query: |
      MATCH (f:Floor)-[:FLOOR_ROOM]->(r:Room)
      WITH f,
           avg(r.temperature) AS AvgTemperature,
           max(r.co2)         AS MaxCo2,
           min(r.humidity)    AS MinHumidity,
           count(r)           AS RoomCount
      RETURN elementId(f)     AS FloorId,
             AvgTemperature,
             MaxCo2,
             MinHumidity,
             RoomCount

reactions:
  # gRPC reaction streams per-room query results back to the test
  # framework's GrpcReactionHandler listening at grpc://localhost:50052.
  - kind: grpc
    id: building-comfort-out
    autoStart: true
    queries:
      - building-comfort
    endpoint: "grpc://localhost:50052"
    timeoutMs: 60000
    batchSize: 1
    batchFlushTimeoutMs: 100
    maxRetries: 5
    connectionRetryAttempts: 10
    initialConnectionTimeoutMs: 15000
    metadata:
      x-query-sequence: "building-comfort"

  # gRPC reaction streams floor-aggregate query results back to the test
  # framework's GrpcReactionHandler listening at grpc://localhost:50053.
  - kind: grpc
    id: building-comfort-floor-agg-out
    autoStart: true
    queries:
      - building-comfort-floor-agg
    endpoint: "grpc://localhost:50053"
    timeoutMs: 60000
    batchSize: 1
    batchFlushTimeoutMs: 100
    maxRetries: 5
    connectionRetryAttempts: 10
    initialConnectionTimeoutMs: 15000
    metadata:
      x-query-sequence: "building-comfort-floor-agg"
