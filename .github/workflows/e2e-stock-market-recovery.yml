name: E2E - stock_market recovery

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Source dispatchers to test (each runs clean control and SIGKILL recovery)."
        type: choice
        options: [standard, adaptive, both]
        default: both
      batching_speed:
        description: "Adaptive maximum batch size; 50 ms maximum wait."
        type: choice
        options: ["5000", "10000", "50000"]
        default: "10000"
      drasi_server_version:
        description: "Release tag; empty = latest. Ignored when repo/ref is set."
        default: ""
      drasi_server_repo:
        description: "Server repo to build (owner/name); empty = drasi-project/drasi-server."
        default: ""
      drasi_server_ref:
        description: "Server branch/tag/SHA to build; empty with repo = default branch."
        default: ""
      drasi_core_ref:
        description: "Optional drasi-project/drasi-core branch override for source builds."
        default: ""
      plugin_registry:
        description: "OCI plugin registry; empty = server default."
        default: ""
      plugin_tag:
        description: "OCI tag for plugins; use a tag compatible with the server."
        default: ""
      timeout_minutes:
        description: "Maximum minutes per recovery wait, excluding builds (1-60)."
        default: "30"

permissions:
  contents: read

jobs:
  prepare:
    name: Build recovery binaries
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      variants: ${{ steps.settings.outputs.variants }}
      timeout_seconds: ${{ steps.settings.outputs.timeout_seconds }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate settings
        id: settings
        env:
          SELECTION: ${{ inputs.variant }}
          MINUTES: ${{ inputs.timeout_minutes }}
          CORE_REF: ${{ inputs.drasi_core_ref }}
          SERVER_REF: ${{ inputs.drasi_server_ref }}
        run: |
          set -euo pipefail
          case "$SELECTION" in
            standard) variants='["standard"]' ;;
            adaptive) variants='["adaptive"]' ;;
            both) variants='["standard","adaptive"]' ;;
            *) echo "Unsupported variant: $SELECTION" >&2; exit 1 ;;
          esac
          [[ "$MINUTES" =~ ^[1-9][0-9]?$ ]] && (( MINUTES <= 60 )) || {
            echo "timeout_minutes must be 1-60" >&2; exit 1;
          }
          [[ -z "$CORE_REF" || -n "$SERVER_REF" ]] || {
            echo "drasi_core_ref requires drasi_server_ref" >&2; exit 1;
          }
          echo "variants=$variants" >> "$GITHUB_OUTPUT"
          echo "timeout_seconds=$((MINUTES * 60))" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: e2e-test-framework

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            jq curl ruby build-essential pkg-config libssl-dev libjq-dev libonig-dev \
            libprotobuf-dev protobuf-compiler cmake clang libclang-dev
          echo "JQ_LIB_DIR=$(dirname "$(find /usr/lib -name libjq.so -print -quit)")" >> "$GITHUB_ENV"

      - name: Build framework and comparator
        working-directory: e2e-test-framework
        run: |
          cargo test --release --locked -p test-run-host --lib drain_barrier_waits_for_success_and_rejects_failure
          cargo build --release --locked -p test-service
          cargo build --release --locked -p test-run-host --bin recovery-compare

      - name: Prepare Drasi Server and bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRASI_REPO: ${{ inputs.drasi_server_repo }}
          DRASI_SERVER_REF: ${{ inputs.drasi_server_ref }}
          DRASI_CORE_REPO: drasi-project/drasi-core
          DRASI_CORE_REF: ${{ inputs.drasi_core_ref }}
          DRASI_SERVER_VERSION: ${{ inputs.drasi_server_version }}
          WORK_DIR: ${{ runner.temp }}/server-build
          ARTIFACTS_DIR: ${{ runner.temp }}/build-artifacts
        run: |
          bash e2e-test-framework/examples/building_comfort/dynamic/run_dynamic.sh --prepare-server
          mkdir -p "$RUNNER_TEMP/bundle"
          server_bin="$(jq -er .binary "$ARTIFACTS_DIR/server-build.json")"
          cp "$server_bin" "$RUNNER_TEMP/bundle/drasi-server"
          cp e2e-test-framework/target/release/test-service "$RUNNER_TEMP/bundle/"
          cp e2e-test-framework/target/release/recovery-compare "$RUNNER_TEMP/bundle/"
          cp "$ARTIFACTS_DIR/server-build.json" "$RUNNER_TEMP/bundle/"
          if [[ -d "$WORK_DIR/drasi-server-src/.git" ]]; then
            git -C "$WORK_DIR/drasi-server-src" rev-parse HEAD > "$RUNNER_TEMP/bundle/server-commit.txt"
            cp "$WORK_DIR/drasi-server-src/Cargo.lock" "$RUNNER_TEMP/bundle/server-Cargo.lock"
          fi
          sha256sum "$RUNNER_TEMP/bundle/drasi-server" "$RUNNER_TEMP/bundle/test-service" \
            "$RUNNER_TEMP/bundle/recovery-compare" > "$RUNNER_TEMP/bundle/sha256.txt"
          tar -czf "$ARTIFACTS_DIR/recovery-binaries.tar.gz" -C "$RUNNER_TEMP/bundle" .

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stock-market-recovery-build
          path: ${{ runner.temp }}/build-artifacts
          retention-days: 14

  recovery:
    name: Stock-market SIGKILL / ${{ matrix.variant }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.prepare.outputs.variants) }}
    env:
      VARIANT: ${{ matrix.variant }}
      BATCH_SIZE: ${{ inputs.batching_speed }}
      TIMEOUT_SECS: ${{ needs.prepare.outputs.timeout_seconds }}
      DRASI_PLUGIN_REGISTRY: ${{ inputs.plugin_registry }}
      DRASI_PLUGIN_TAG: ${{ inputs.plugin_tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ruby jq curl libjq1 libonig5
      - uses: actions/download-artifact@v7
        with:
          name: stock-market-recovery-build
          path: ${{ runner.temp }}/build-artifacts
      - name: Unpack binaries
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/results"
          tar -xzf "$RUNNER_TEMP/build-artifacts/recovery-binaries.tar.gz" -C "$RUNNER_TEMP/bin"
          chmod +x "$RUNNER_TEMP/bin/drasi-server" "$RUNNER_TEMP/bin/test-service" "$RUNNER_TEMP/bin/recovery-compare"
          echo "DRASI_SERVER_BIN=$RUNNER_TEMP/bin/drasi-server" >> "$GITHUB_ENV"
          echo "TEST_SERVICE_BIN=$RUNNER_TEMP/bin/test-service" >> "$GITHUB_ENV"
          echo "RECOVERY_COMPARE_BIN=$RUNNER_TEMP/bin/recovery-compare" >> "$GITHUB_ENV"
          cp "$RUNNER_TEMP/bin/sha256.txt" "$RUNNER_TEMP/bin/server-build.json" "$RUNNER_TEMP/results/"

      - name: Clean control against golden
        run: |
          python3 e2e-test-framework/examples/stock_market/recovery/run_recovery.py \
            --mode clean --variant "$VARIANT" --batch-size "$BATCH_SIZE" \
            --timeout "$TIMEOUT_SECS" --work-dir "$RUNNER_TEMP/results/clean"

      - name: SIGKILL recovery against golden
        run: |
          python3 e2e-test-framework/examples/stock_market/recovery/run_recovery.py \
            --mode sigkill --variant "$VARIANT" --batch-size "$BATCH_SIZE" \
            --timeout "$TIMEOUT_SECS" --work-dir "$RUNNER_TEMP/results/sigkill"

      - name: Required recovery verdicts
        if: always()
        run: |
          set -euo pipefail
          {
            printf '## Stock-market SIGKILL recovery / %s\n\n' "$VARIANT"
            printf 'Gate: golden query snapshot equality after both sources drain and an actual SIGKILL restart. HTTP delivery remains unverified.\n\n'
            for mode in clean sigkill; do
              verdict="$RUNNER_TEMP/results/$mode/verdict.json"
              if [[ ! -s "$verdict" ]]; then
                echo "ERROR: missing $mode verdict"; exit 1
              fi
              jq . "$verdict"
              jq -e --arg mode "$mode" --arg variant "$VARIANT" '
                .passed == true and .mode == $mode and .variant == $variant and
                .scope == "golden-query-snapshot" and
                ($mode == "clean" or .crash_injected == true) and .error == null
              ' "$verdict" >/dev/null || { echo "ERROR: $mode recovery not verified"; exit 1; }
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stock-market-sigkill-${{ matrix.variant }}
          path: ${{ runner.temp }}/results
          retention-days: 14