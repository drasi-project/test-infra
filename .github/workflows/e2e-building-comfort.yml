# Scheduled / manual E2E tests for the building_comfort scenario.
#
# Coverage is DYNAMIC-first: variants boot a BARE Drasi Server and apply the
# scenario at runtime via the admin REST API from reusable component JSON
# under examples/building_comfort/dynamic/ (driven by run_dynamic.sh). A
# variant is a small component/config selection, not a whole folder.
#
#   * http_* / grpc_* variants -> dynamic/run_dynamic.sh (REST-applied components)
#   * drasi_lib                 -> embedded in-process engine (no external server;
#                                  runs via ci/drasi_lib/run_test_ci.sh)
#
# HTTP note: `http_adaptive` batches on BOTH the framework dispatcher
# (/events/batch ingress) and the reaction ({"batch":[...]} egress) -- the
# combination that reproduces the ~5x gRPC-style throughput. (Server-side
# adaptiveEnabled alone leaves egress per-result and stays at the standard
# rate, so it is not wired as a variant.) This /events/batch path was
# previously retired for collapsing per-room results; it is gated by the inline
# Sha256Determinism baseline, so a lossy run fails rather than silently
# passing. Treat http_adaptive as under evaluation until a full-count
# determinism-passing run is confirmed.
#
# Variant selection:
#   - Scheduled: 07:00 UTC runs all five variants in one matrix.
#   - Manual: tick a checkbox per variant; the matrix is built from checked.

name: E2E - building_comfort

on:
  workflow_dispatch:
    inputs:
      # --- Variants (one checkbox each; GitHub renders booleans as checkboxes) ---
      drasi_lib:
        description: "drasi_lib (embedded, in-process)"
        type: boolean
        default: true
      http_standard:
        description: "http_standard (HTTP, REST-applied)"
        type: boolean
        default: true
      http_adaptive:
        description: "http_adaptive (HTTP, dispatcher + egress batching)"
        type: boolean
        default: false
      grpc_standard:
        description: "grpc_standard (gRPC, REST-applied)"
        type: boolean
        default: true
      grpc_adaptive:
        description: "grpc_adaptive (gRPC adaptive dispatcher)"
        type: boolean
        default: false

      # --- Config axes (applied to whichever variants run) ---
      batching_speed:
        description: "Adaptive batching speed preset (affects adaptive variants only)."
        type: choice
        options:
          - low
          - medium
          - high
          - max
        default: medium
      query_tuning:
        description: "Query capacity preset (priority/dispatch buffers, bootstrap buffer)."
        type: choice
        options:
          - low
          - medium
          - high
        default: medium
      persist_index:
        description: "Use the built-in RocksDB persistent index (persistIndex)."
        type: boolean
        default: false
      state_store:
        description: "Use the redb plugin state store (stateStore)."
        type: boolean
        default: false
      bootstrap_size:
        description: "Large-bootstrap preset (rooms). Scales the initial graph so bootstrap load is measured separately from steady-state."
        type: choice
        options:
          - "off"
          - 10k
          - 100k
          - 1m
        default: "off"

      # --- Run settings ---
      drasi_server_version:
        description: "drasi-server release tag (e.g. v0.1.5). Only used when repo/ref below are both empty. Empty = latest."
        required: false
        default: ""
      # Source-build escape hatch, manual dispatch only. Setting EITHER of the
      # next two builds drasi-server from source instead of downloading a
      # release; a repo without a ref builds that repo's default branch.
      # Scheduled runs leave both empty and download the release binary,
      # keeping the published time series comparable.
      drasi_server_repo:
        description: "drasi-server repo (owner/name) to BUILD from source. Empty = drasi-project/drasi-server."
        required: false
        default: ""
      drasi_server_ref:
        description: "drasi-server branch/tag/SHA to BUILD from source. Empty with a repo set = that repo's default branch."
        required: false
        default: ""
      timeout_minutes:
        description: "Max minutes to wait for the test to finish."
        required: false
        default: "30"
  schedule:
    # 07:00 UTC — full set (drasi_lib + dynamic http/grpc, standard + adaptive).
    - cron: "0 7 * * *"

permissions:
  contents: read

jobs:
  # Resolve the selected variants into a JSON array consumed by the run job's
  # matrix. workflow_dispatch uses the per-variant checkboxes; scheduled runs
  # (checkboxes absent) cover every variant.
  select-variants:
    name: select variants
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.compute.outputs.variants }}
    steps:
      - name: Compute variant matrix
        id: compute
        env:
          # Boolean inputs arrive as "true"/"false" (empty on scheduled runs).
          V_DRASI_LIB: ${{ inputs.drasi_lib }}
          V_HTTP_STD: ${{ inputs.http_standard }}
          V_HTTP_ADAPTIVE: ${{ inputs.http_adaptive }}
          V_GRPC_STD: ${{ inputs.grpc_standard }}
          V_GRPC_ADAPTIVE: ${{ inputs.grpc_adaptive }}
        run: |
          variants=()
          if [[ -z "$V_DRASI_LIB$V_HTTP_STD$V_HTTP_ADAPTIVE$V_GRPC_STD$V_GRPC_ADAPTIVE" ]]; then
            # No checkboxes present -> scheduled run; cover every variant.
            variants=(drasi_lib http_standard http_adaptive grpc_standard grpc_adaptive)
          else
            [[ "$V_DRASI_LIB"     == "true" ]] && variants+=(drasi_lib)
            [[ "$V_HTTP_STD"      == "true" ]] && variants+=(http_standard)
            [[ "$V_HTTP_ADAPTIVE" == "true" ]] && variants+=(http_adaptive)
            [[ "$V_GRPC_STD"      == "true" ]] && variants+=(grpc_standard)
            [[ "$V_GRPC_ADAPTIVE" == "true" ]] && variants+=(grpc_adaptive)
          fi

          if (( ${#variants[@]} == 0 )); then
            echo "ERROR: no variants selected. Tick at least one checkbox." >&2
            exit 1
          fi

          json="$(printf '%s\n' "${variants[@]}" | jq -R . | jq -sc .)"
          echo "Selected variants: $json"
          echo "variants=$json" >> "$GITHUB_OUTPUT"

  building-comfort:
    name: building_comfort / ${{ matrix.variant }}
    needs: select-variants
    # ubuntu-latest (2-vCPU hosted). Larger runners (e.g. ubuntu-latest-8-cores)
    # aren't available on personal forks. Fine for the throughput RATIO and
    # functional/loss checks; precise absolute numbers should come from the
    # pinned Azure self-hosted profile (docs/self-hosted-performance-runners.md).
    runs-on: ubuntu-latest
    # Job-level hard cap (separate from the `timeout_minutes` input, which only
    # bounds the driver's internal completion-wait loop -- see "Compute timeout
    # (seconds)" below). Checkout + Rust toolchain + cargo build + drasi-server
    # download + component setup can themselves take a large chunk of this
    # budget, so it must comfortably exceed setup time + the actual test run.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.select-variants.outputs.variants) }}
    env:
      VARIANT: ${{ matrix.variant }}
      # drasi_lib runs in-process and ignores these. Every other variant
      # downloads a drasi-server release binary, unless drasi_server_repo
      # and/or drasi_server_ref is set (manual dispatch only), in which case
      # drasi-server is built from that repo/ref's source.
      DRASI_SERVER_VERSION: ${{ inputs.drasi_server_version }}
      DRASI_REPO: ${{ inputs.drasi_server_repo }}
      DRASI_SERVER_REF: ${{ inputs.drasi_server_ref }}
      # Determinism baselines live inline in each variant's config.json under
      # the Sha256Determinism completion handler's `expected` map. The
      # framework flips the test-run status to Error on mismatch; the runner
      # scripts surface that via the test-service REST API. Adaptive variants
      # reuse the same baselines as their plain counterparts because adaptive
      # batching must not change results.

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: e2e-test-framework

      - name: Install runtime deps (jq, curl)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq curl

      # test-run-host enables drasi-core's `middleware-jq` feature, which
      # pulls in jq-sys; jq-sys links against the system libjq + libonig.
      # Mirror lint.yml / drasi-server's Dockerfile.
      - name: Install build deps for libjq
        run: |
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libjq-dev libonig-dev \
            libprotobuf-dev protobuf-compiler cmake clang libclang-dev

      - name: Set JQ_LIB_DIR
        run: echo "JQ_LIB_DIR=$(dirname $(find /usr/lib -name 'libjq.so' | head -1))" >> "$GITHUB_ENV"

      - name: Compute timeout (seconds)
        run: |
          mins="${{ inputs.timeout_minutes }}"
          [[ -z "$mins" ]] && mins=30
          echo "TIMEOUT_SECS=$(( mins * 60 ))" >> "$GITHUB_ENV"

      - name: Build test-service
        working-directory: e2e-test-framework
        run: |
          cargo build --release --locked --manifest-path test-service/Cargo.toml
          echo "TEST_SERVICE_BIN=$GITHUB_WORKSPACE/e2e-test-framework/target/release/test-service" >> "$GITHUB_ENV"

      - name: Record start time
        run: echo "RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Run test
        id: test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTS_DIR: ${{ runner.temp }}/artifacts
          WORK_DIR: ${{ runner.temp }}/ci_work
          # Adaptive batching preset (low|medium|high). Empty on scheduled
          # runs -> run_dynamic.sh defaults to medium. Only adaptive variants
          # consume it; standard variants ignore it.
          BATCHING_SPEED: ${{ inputs.batching_speed }}
          # Query capacity preset (low|medium|high). Empty on scheduled runs ->
          # run_dynamic.sh defaults to medium. Applied to all dynamic variants'
          # query components; perf-only, results must not change.
          QUERY_TUNING: ${{ inputs.query_tuning }}
          # Server instance-config toggles (independent). Empty on scheduled
          # runs -> run_dynamic.sh defaults both to false (standard). Each
          # combination selects a committed base yaml.
          PERSIST_INDEX: ${{ inputs.persist_index }}
          STATE_STORE: ${{ inputs.state_store }}
          # Large-bootstrap preset (off|10k|100k|1m). Empty on scheduled runs ->
          # run_dynamic.sh leaves the committed small scenario unchanged. Only
          # the dynamic variants consume it; drasi_lib ignores it.
          BOOTSTRAP_SIZE: ${{ inputs.bootstrap_size == 'off' && '' || inputs.bootstrap_size }}
        run: bash e2e-test-framework/examples/building_comfort/run_variant.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: building_comfort-${{ matrix.variant }}
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: warn

      # Build the durable summary record for drasi-project/test-results.
      # Runs even when the test failed: a failed run is a datapoint too.
      - name: Build result summary
        if: always()
        env:
          WORKFLOW_FILE: e2e-building-comfort.yml
          RUNNER_LABEL: ubuntu-latest
        run: |
          python3 .github/scripts/emit_summary.py \
            --artifacts "${{ runner.temp }}/artifacts" \
            --scenario building_comfort \
            --variant "${{ matrix.variant }}" \
            --job-status "${{ steps.test.outcome }}" \
            --output "${{ runner.temp }}/summary/building_comfort__${{ matrix.variant }}.json"

      - name: Upload result summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: summary-building_comfort-${{ matrix.variant }}
          path: ${{ runner.temp }}/summary
          if-no-files-found: warn

  # Publish the summaries to drasi-project/test-results, which keeps a small
  # permanent history (GitHub artifacts expire after 90 days). One job, one
  # commit, one push - see publish-test-results.yml for why aggregating
  # matters. `always()` so a failed test run is still recorded.
  #
  # Scheduled runs only. The published history is a time series, so every
  # point has to be comparable: same trigger, same cadence, no operator
  # choosing when to record. Manual runs exist to try things out - a different
  # drasi-server version, a branch, a one-off timeout - and mixing those in
  # would put unexplained spikes in the trend with nothing in the record to
  # explain them. To exercise this path from a branch, temporarily widen this
  # condition rather than publishing dispatch runs by default.
  publish-results:
    needs: [building-comfort]
    if: always() && github.event_name == 'schedule'
    uses: ./.github/workflows/publish-test-results.yml
    secrets:
      TEST_RESULTS_APP_PRIVATE_KEY: ${{ secrets.TEST_RESULTS_APP_PRIVATE_KEY }}
