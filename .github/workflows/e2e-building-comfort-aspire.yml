name: E2E - building_comfort Aspire Azure

on:
  workflow_dispatch:
    inputs:
      location:
        description: "Azure region for the Dedicated D8 Container Apps environment"
        required: true
        default: "westus3"
      timeout_minutes:
        description: "Maximum time to wait for the Azure E2E runner"
        required: true
        default: "45"
      cleanup_resources:
        description: "Delete Aspire-created resources after collecting artifacts"
        required: true
        type: boolean
        default: true
      drasi_server_image:
        description: "Optional Drasi Server image; empty builds the release-binary image"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: building-comfort-aspire-azure
  cancel-in-progress: false

env:
  APPHOST: aspire/Drasi.E2E.AppHost/Drasi.E2E.AppHost.csproj
  ASPIRE_VERSION: "13.4.6"
  AZURE_RESOURCE_GROUP: drasi-e2e-aspire-ci
  ARTIFACTS_DIR: ${{ github.workspace }}/azure-e2e-artifacts

jobs:
  building-comfort-aspire-azure:
    name: building_comfort / Aspire ACA grpc_standard
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install Aspire CLI
        run: |
          dotnet tool install --global Aspire.Cli --version "$ASPIRE_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Show deployment configuration
        run: |
          aspire --version
          az account show --query '{subscription:name,id:id,tenant:tenantId}' --output json
          echo "Resource group: $AZURE_RESOURCE_GROUP"
          echo "Location: ${{ inputs.location }}"

      - name: Deploy Aspire environment
        env:
          Azure__SubscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          Azure__Location: ${{ inputs.location }}
          Azure__ResourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          DRASI_SERVER_IMAGE: ${{ inputs.drasi_server_image }}
        run: |
          aspire deploy \
            --apphost "$APPHOST" \
            --environment azure-ci \
            --non-interactive \
            --include-exception-details

      - name: Wait for test summary
        env:
          TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        run: |
          set -euo pipefail

          aca_env="$(az containerapp env list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query '[0].name' --output tsv)"
          if [[ -z "$aca_env" ]]; then
            echo "No Container Apps environment found" >&2
            exit 1
          fi

          storage_json="$(az containerapp env storage list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$aca_env" \
            --query '[0].properties.azureFile' --output json)"
          storage_account="$(jq -r '.accountName' <<< "$storage_json")"
          file_share="$(jq -r '.shareName' <<< "$storage_json")"
          storage_key="$(az storage account keys list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --account-name "$storage_account" \
            --query '[0].value' --output tsv)"
          echo "::add-mask::$storage_key"

          deadline=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))
          while (( $(date +%s) < deadline )); do
            completed="$(az storage file exists \
              --account-name "$storage_account" \
              --account-key "$storage_key" \
              --share-name "$file_share" \
              --path completion.txt \
              --query exists --output tsv)"
            if [[ "$completed" == "true" ]]; then
              break
            fi

            az containerapp logs show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name e2e-runner \
              --type console \
              --tail 20 2>/dev/null \
              | jq -r 'select(.Log != null) | .Log' \
              | tail -n 5 || true
            sleep 15
          done

          if [[ "${completed:-false}" != "true" ]]; then
            echo "Timed out waiting for completion.txt" >&2
            exit 1
          fi

          mkdir -p "$ARTIFACTS_DIR"
          az storage file download-batch \
            --account-name "$storage_account" \
            --account-key "$storage_key" \
            --source "$file_share" \
            --destination "$ARTIFACTS_DIR" \
            --no-progress

      - name: Verify and publish test summary
        run: |
          set -euo pipefail
          test -s "$ARTIFACTS_DIR/summary.md"
          test -s "$ARTIFACTS_DIR/determinism_verdict.json"

          jq -e 'all(.results[]; .passed == true)' \
            "$ARTIFACTS_DIR/determinism_verdict.json"

          cat "$ARTIFACTS_DIR/summary.md"
          cat "$ARTIFACTS_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect Azure logs on failure
        if: failure()
        run: |
          mkdir -p "$ARTIFACTS_DIR/logs"
          for app in e2e-runner drasi-server redis; do
            az containerapp logs show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$app" \
              --type console \
              --tail 300 \
              > "$ARTIFACTS_DIR/logs/${app}.log" 2>&1 || true
            az containerapp logs show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$app" \
              --type system \
              --tail 300 \
              > "$ARTIFACTS_DIR/logs/${app}-system.log" 2>&1 || true
          done

      - name: Upload Azure E2E artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: building-comfort-aspire-aca-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ARTIFACTS_DIR }}
          if-no-files-found: warn

      - name: Clean dedicated CI resource group
        if: always() && inputs.cleanup_resources
        run: |
          set +e

          for app in e2e-runner drasi-server redis; do
            az containerapp delete \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$app" \
              --yes >/dev/null 2>&1 &
          done
          wait

          aca_env="$(az containerapp env list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query '[0].name' --output tsv 2>/dev/null)"
          if [[ -n "$aca_env" ]]; then
            az containerapp env delete \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$aca_env" \
              --yes >/dev/null 2>&1
          fi

          # The resource group is dedicated to this workflow, but is preserved
          # because the GitHub OIDC role assignments are scoped to it.
          for pass in 1 2 3; do
            mapfile -t ids < <(az resource list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query '[].id' --output tsv 2>/dev/null)
            (( ${#ids[@]} == 0 )) && break
            for id in "${ids[@]}"; do
              az resource delete --ids "$id" >/dev/null 2>&1 || true
            done
            sleep 15
          done
