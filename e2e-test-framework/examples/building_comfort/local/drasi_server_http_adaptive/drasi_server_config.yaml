# Drasi Server config for the building_comfort / drasi_server_http_adaptive
# E2E test.
#
# Wire layout differs from drasi_server_http:
#   - source dispatcher targets http://localhost:8081 with source_id "events-http"
#     (adaptive batching: batch_size=1000, batch_timeout_ms=50)
#   - reaction handler listens at http://localhost:3000/events
#   - reaction test_reaction_id is "http-webhook"
#
# Run from this folder using either:
#   a) the prebuilt drasi-server binary (see
#      https://drasi.io/drasi-server/how-to-guides/installation/download-binary/):
#        <path/to>/bin/drasi-server --config drasi_server_config.yaml
#   b) a checkout of the drasi-server repo:
#        cargo run --release --manifest-path <path/to/drasi-server>/Cargo.toml -- --config drasi_server_config.yaml

apiVersion: drasi.io/v1
id: building-comfort-http-adaptive
host: "0.0.0.0"
port: 8080
logLevel: info
persistConfig: false

autoInstallPlugins: true
# Disable cosign signature verification so locally-built plugins
# (e.g. target/release/plugins/ when running via `cargo run` from a
# drasi-server checkout) are loaded without a signed lockfile.
verifyPlugins: false
plugins:
  - ref: source/http
  - ref: reaction/http
  - ref: reaction/log

sources:
  # HTTP webhook source matching the dispatcher's source_id="events-http"
  # on port 8081.
  - kind: http
    id: events-http
    autoStart: true
    host: "0.0.0.0"
    port: 8081
    timeoutMs: 60000

queries:
  - id: building-comfort
    autoStart: true
    queryLanguage: Cypher
    sources:
      - sourceId: events-http
    query: |
      MATCH (r:Room)
      RETURN elementId(r) AS RoomId,
             r.temperature AS Temperature,
             r.humidity AS Humidity,
             r.co2 AS Co2

  # Floor-level aggregate: exercises a one-hop traversal across
  # Floor -[:FLOOR_ROOM]-> Room plus avg / min / max / count aggregations.
  - id: building-comfort-floor-agg
    autoStart: true
    queryLanguage: Cypher
    sources:
      - sourceId: events-http
    query: |
      MATCH (f:Floor)-[:FLOOR_ROOM]->(r:Room)
      WITH f,
           avg(r.temperature) AS AvgTemperature,
           max(r.co2)         AS MaxCo2,
           min(r.humidity)    AS MinHumidity,
           count(r)           AS RoomCount
      RETURN elementId(f)     AS FloorId,
             AvgTemperature,
             MaxCo2,
             MinHumidity,
             RoomCount

reactions:
  # HTTP webhook reaction posts query results to the test framework's
  # HttpReactionHandler at http://localhost:3000/events.
  - kind: http
    id: http-webhook
    autoStart: true
    queries:
      - building-comfort
    baseUrl: "http://localhost:3000"
    timeoutMs: 60000
    outputTemplates:
      routes:
        building-comfort:
          added:
            method: POST
            url: "/events"
            headers:
              Content-Type: "application/json"
              X-Query-Sequence: "building-comfort"
          updated:
            method: POST
            url: "/events"
            headers:
              Content-Type: "application/json"
              X-Query-Sequence: "building-comfort"
          deleted:
            method: POST
            url: "/events"
            headers:
              Content-Type: "application/json"
              X-Query-Sequence: "building-comfort"

  # Floor-aggregate HTTP webhook reaction posts results to the test
  # framework's HttpReactionHandler at http://localhost:3001/events.
  - kind: http
    id: http-webhook-floor-agg
    autoStart: true
    queries:
      - building-comfort-floor-agg
    baseUrl: "http://localhost:3001"
    timeoutMs: 60000
    outputTemplates:
      routes:
        building-comfort-floor-agg:
          added:
            method: POST
            url: "/events"
            headers:
              Content-Type: "application/json"
              X-Query-Sequence: "building-comfort-floor-agg"
          updated:
            method: POST
            url: "/events"
            headers:
              Content-Type: "application/json"
              X-Query-Sequence: "building-comfort-floor-agg"
          deleted:
            method: POST
            url: "/events"
            headers:
              Content-Type: "application/json"
              X-Query-Sequence: "building-comfort-floor-agg"
